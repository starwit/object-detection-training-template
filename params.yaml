# Settings for this project. See README.md, "Configure params.yaml"
# and "Compare models and settings", for what to change here.

seed: 42

data:
  # Name of the prepared dataset folder under datasets/.
  dataset_name: my-dataset
  # Your classes. For label files without a data.yaml, the order matters:
  # class 0 in a label file is the first name here, class 1 the second, ...
  custom_classes:
  - object
  class_mapping: {}  # Optional: train several classes as one, e.g. {vehicle: [car, truck]}
  # Optional: classes in a source's data.yaml that you do not want to train;
  # their boxes are left out, for example ignore_classes: [bottle]
  ignore_classes: []

prepare:
  # Share of training data used to generate missing validation/test sets.
  # Supplied sets from CVAT exports or outer folders take precedence.
  val_split: 0.1
  test_split: 0.1

train:
  # Select a name from models below: yolo26n, yolo26m,
  # rfdetr-nano, rfdetr-medium, or finetune (requires saved weights).
  model: yolo26n
  # Images are resized to this size (pixels). Larger finds smaller objects, but is slower.
  image_size: 640
  # How often training goes through all training images.
  epochs: 100
  # auto: the first GPU if there is one, otherwise the CPU. Or cpu, cuda:0, cuda:1, ...
  device: auto

models_defaults:
  # Applied to every model of a backend; values in models.<key> win.
  yolo:
    cache_dir: models/pretrained/yolo
  rfdetr:
    cache_dir: models/pretrained/rfdetr

# Each name directly below models is a value you can select with train.model.
models:
  yolo26n:
    backend: yolo
    asset_id: yolo26n.pt
    batch_size: 8              # Images processed at once.
    effective_batch_size: 64  # Optional accumulation target.

  yolo26m:
    backend: yolo
    asset_id: yolo26m.pt
    batch_size: 8              # Images processed at once.
    effective_batch_size: 64  # Optional accumulation target.

  # Fine-tune a trained model: copy its best.pt to models/finetune/best.pt.
  finetune:
    backend: yolo
    asset_id: yolo26m.pt
    batch_size: 8              # Images processed at once.
    effective_batch_size: 64  # Optional accumulation target.
    init_weights: models/finetune/best.pt
    epochs: 30
    freeze_backbone: true
    extra_train_kwargs:
      optimizer: AdamW   # So YOLO uses lr0 instead of choosing its own.
      lr0: 0.0002        # About 1/8 of the normal learning rate.
      warmup_epochs: 0   # No warm-up for an already trained model.
      patience: 20

  rfdetr-nano:
    backend: rfdetr
    variant: nano
    asset_id: rf-detr-nano.pth
    batch_size: 2              # Images processed at once.
    effective_batch_size: 16  # Optional accumulation target.

  rfdetr-medium:
    backend: rfdetr
    variant: medium
    asset_id: rf-detr-medium.pth
    batch_size: 2              # Images processed at once.
    effective_batch_size: 16  # Optional accumulation target.

evaluation:
  # Every run is compared against this model once it exists
  # (tools/export_baseline.py puts it there). null: never compare.
  baseline_weights_path: models/current_best/best.pt
