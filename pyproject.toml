[tool.poetry]
name = "object-detection-training-template"
version = "0.1.0"
description = "Template object detection training project built on object-detector-trainer"
authors = ["edblu1"]
license = "AGPL-3.0-only"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
dvc = "^3.60.1"
dvc-ssh = "^4.2.1"
pyyaml = "^6.0.2"
object-detector-trainer = { git = "https://github.com/starwit/object-detector-trainer.git", rev = "d977da66dd1d59e23e3888690eaea0e0388b75a5" }


[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"

[tool.pytest.ini_options]
markers = [
    "heavy: real training through the DVC pipeline",
]
testpaths = ["tests"]
norecursedirs = [".venv", "venv", "site-packages"]


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
