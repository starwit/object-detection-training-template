# Each stage calls the object-detector-trainer command line. The run folder
# name is fixed ("current") so DVC can track its outputs; DVC experiments keep
# the history of earlier runs.
stages:
  prepare_data:
    cmd: object-detector-trainer --stage prepare
    params:
      - seed
      - data
      - prepare
    deps:
      - poetry.lock
      - raw_data/
    outs:
      # Rebuilt from raw_data/ and params.yaml; its images are hard links to
      # raw_data/. Caching would replace them with copies, so DVC only tracks them.
      - datasets/${data.dataset_name}:
          cache: false

  train_model:
    cmd: object-detector-trainer --stage train --run-name current
    params:
      - seed
      - data
      - train
      - models_defaults
      - models
    deps:
      - poetry.lock
      - datasets/${data.dataset_name}
      # Input for fine-tuning model entries (init_weights).
      - models/finetune
    outs:
      - runs/current/train

  evaluate_model:
    cmd: object-detector-trainer --stage evaluate --run-name current
    params:
      - seed
      - data
      - evaluation
    deps:
      - poetry.lock
      - datasets/${data.dataset_name}
      - runs/current/train
    # Evaluation runs on every experiment (a few minutes, never training), so a
    # baseline that was exported or downloaded since the last run is always used.
    # The baseline weights are deliberately not a dependency: DVC would then
    # refuse to run in a clone where they are not downloaded.
    always_changed: true
    outs:
      - runs/current/eval
    metrics:
      - runs/current/metrics.json
